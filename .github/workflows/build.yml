name: Build Force5GHzTether
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git ~/.theos
          # Find dm.pl and copy it
          DM_PATH=$(find ~/.theos -name "dm.pl" -type f 2>/dev/null | head -1)
          echo "Found dm.pl at: $DM_PATH"
          if [ -n "$DM_PATH" ]; then
            cp "$DM_PATH" ~/.theos/bin/dm.pl
            chmod +x ~/.theos/bin/dm.pl
            echo "Copied dm.pl to ~/.theos/bin/dm.pl"
          else
            echo "ERROR: dm.pl not found!"
            exit 1
          fi
          ls -la ~/.theos/bin/dm.pl
          
      - name: Build tweak
        env:
          THEOS: ~/.theos
        run: |
          make package
          
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Force5GHzTether-deb
          path: Force5GHzTether/packages/*.deb