name: Build Force5GHzTether
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git ~/.theos
          # Find and copy dm.pl
          find ~/.theos -name "dm.pl" -type f 2>/dev/null
          cp $(find ~/.theos -name "dm.pl" -type f 2>/dev/null | head -1) ~/.theos/bin/dm.pl 2>/dev/null || true
          chmod +x ~/.theos/bin/dm.pl 2>/dev/null || true
          ls -la ~/.theos/bin/dm.pl
          
      - name: Build tweak
        env:
          THEOS: ~/.theos
        run: |
          make package
          
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Force5GHzTether-deb
          path: Force5GHzTether/packages/*.deb